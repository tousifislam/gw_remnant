[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gw_remnant"
version = "0.3.0"
description = "Python package to extract remnant black hole properties from gravitational waveforms"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Tousif Islam", email = "tousifislam24@gmail.com"},
    {name = "Scott Field"},
    {name = "Gaurav Khanna"},
]
maintainers = [
    {name = "Tousif Islam", email = "tousifislam24@gmail.com"},
]
keywords = ["gravitational waves", "black holes", "numerical relativity", "remnant properties"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Other Audience",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "matplotlib>=3.3.0",
    "gwtools",
]

[project.optional-dependencies]
surrogates = ["gwsurrogate", "surfinBH"]
lal = ["lal", "lalsimulation"]
all = ["gwsurrogate", "surfinBH", "lal", "lalsimulation"]
dev = ["pytest>=6.0", "pytest-cov", "black", "flake8", "ipython", "jupyter"]

[project.urls]
Homepage = "https://github.com/tousifislam/gw_remnant"
"Bug Reports" = "https://github.com/tousifislam/gw_remnant/issues"
Source = "https://github.com/tousifislam/gw_remnant"

[tool.setuptools.packages.find]
include = ["gw_remnant*"]
